# VolKVN / v2rayNG: compile + JVM unit tests on Temurin JDK 19–26.
# Modeled after DaiHusim .github/workflows/jdk-matrix-test.yml (manual JDK matrix).
# Android minSdk is 24 — this matrix validates the Gradle toolchain, not API 19–23 emulators.
name: JDK matrix (VolKVN Android tests)

on:
  workflow_dispatch:
    inputs:
      run_assemble:
        description: "Also run assemblePlaystoreDebug (slower)"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: jdk-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  libv2ray-aar:
    name: libv2ray.aar (once)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download libv2ray.aar (latest release)
        run: |
          mkdir -p V2rayNG/app/libs
          API_URL="https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest"
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" > /tmp/androidlibxraylite_latest.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          with open('/tmp/androidlibxraylite_latest.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          for asset in data.get('assets', []):
              if asset.get('name') == 'libv2ray.aar':
                  print(asset.get('browser_download_url', ''))
                  break
          PY
          )"
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "libv2ray.aar asset not found in latest release"
            exit 1
          fi
          curl -fL "$DOWNLOAD_URL" -o V2rayNG/app/libs/libv2ray.aar
          ls -la V2rayNG/app/libs/libv2ray.aar

      - name: Upload libv2ray.aar
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-aar
          path: V2rayNG/app/libs/libv2ray.aar
          if-no-files-found: error

  volkvn-android-tests:
    name: JDK ${{ matrix.java-version }} · compile + unit tests
    needs: libv2ray-aar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java-version: [19, 20, 21, 22, 23, 24, 25, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download libv2ray.aar
        uses: actions/download-artifact@v8
        with:
          name: libv2ray-aar
          path: V2rayNG/app/libs

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle
          cache-dependency-path: V2rayNG/**/build.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Prepare Gradle wrapper
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          chmod +x gradlew

      - name: Ensure gradle-wrapper.jar exists
        working-directory: V2rayNG
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar already present"
            exit 0
          fi
          DIST_URL="$(sed -n 's/^distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-\(.*\)-bin.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$DIST_URL" ]; then
            echo "Cannot resolve Gradle version from gradle-wrapper.properties"
            exit 1
          fi
          JAR_URL="https://raw.githubusercontent.com/gradle/gradle/v${DIST_URL}/gradle/wrapper/gradle-wrapper.jar"
          curl -fL "$JAR_URL" -o gradle/wrapper/gradle-wrapper.jar

      - name: Compile Playstore debug
        working-directory: V2rayNG
        run: |
          java -version
          ./gradlew --no-daemon compilePlaystoreDebugKotlin

      - name: Unit tests (Playstore debug)
        working-directory: V2rayNG
        run: ./gradlew --no-daemon testPlaystoreDebugUnitTest

      - name: Assemble Playstore debug APK
        if: github.event.inputs.run_assemble == 'true'
        working-directory: V2rayNG
        run: ./gradlew --no-daemon assemblePlaystoreDebug

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk-${{ matrix.java-version }}
          path: |
            V2rayNG/app/build/reports/tests/
            V2rayNG/app/build/test-results/
          if-no-files-found: ignore
